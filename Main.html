<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O Inimigo Invisível - HQ</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bangers&family=Open+Sans:wght@400;700&display=swap");

      :root {
        --borda-externa: 4px solid #000;
        --borda-interna: 2px solid #000;
        --espacamento: 15px;
        --cor-fundo: #1a1a1a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background-color: var(--cor-fundo);
        margin: 0;
        padding: 40px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: "Open Sans", sans-serif;
      }

      /* Container Principal Responsivo */
      .hq-container {
        width: 100%;
        max-width: 210mm; /* Limita ao A4 */
        background-color: #fcfcfc;
        padding: 15mm;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
      }

      /* Semântica para a Capa */
      .capa-hq {
        display: flex;
        flex-direction: column;
        align-items: center;
        border: var(--borda-externa);
        padding: 20px;
        margin-bottom: 40px;
        background: #fff;
        box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.15);
        break-after: page; /* Comando moderno para quebra de impressão */
      }

      .capa-header {
        text-align: center;
        border-bottom: var(--borda-interna);
        width: 100%;
        padding-bottom: 15px;
        margin-bottom: 20px;
      }

      .capa-titulo {
        font-family: "Bangers", cursive;
        font-size: clamp(3rem, 8vw, 4.5rem); /* Ajuste dinâmico de fonte */
        margin: 0;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #e74c3c;
        text-shadow: 3px 3px 0 #000;
      }

      .capa-subtítulo {
        margin: 5px 0 0 0;
        font-weight: bold;
        text-transform: uppercase;
        font-size: 1.1rem;
        letter-spacing: 1px;
        color: #555;
      }

      .capa-arte {
        width: 100%;
        height: 700px;
        border: var(--borda-interna);
        box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.2);
      }

      .capa-rodape {
        margin-top: 20px;
        font-family: "Bangers", cursive;
        font-size: 1.5rem;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      header {
        text-align: center;
        border-bottom: var(--borda-externa);
        margin-bottom: 25px;
        padding-bottom: 10px;
      }

      h1 {
        font-family: "Bangers", cursive;
        font-size: 3.5rem;
        margin: 0;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      p.subtitle {
        margin: 5px 0;
        font-weight: bold;
        text-transform: uppercase;
        font-size: 0.9rem;
      }

      /* 
        NOVA ESTRUTURA: Agrupando por Páginas
        Impede que a impressora corte quadros no meio.
      */
      .pagina-hq {
        display: grid;
        grid-template-columns: repeat(
          12,
          1fr
        ); /* Grid de 12 colunas para flexibilidade total */
        gap: var(--espacamento);
        margin-bottom: 40px;
        break-after: page;
      }

      /* Removendo quebra na última página */
      .pagina-hq:last-of-type {
        break-after: auto;
        margin-bottom: 0;
      }

      /* Quadros Semânticos (<figure>) */
      .quadro {
        border: 5px solid #000;
        border-radius: 4px;
        background: #fff;
        margin: 0; /* Reseta margem padrão do figure */
        line-height: 0; /* Remove espaço fantasma abaixo da imagem */
        box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.2);
        overflow: hidden;
      }

      .quadro img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Garante que a imagem preencha sem distorcer proporção */
        display: block;
      }

      /* 
        SISTEMA DE LARGURA BASEADO EM 12 COLUNAS
        Use essas classes para ditar a proporção do painel na tela.
      */
      .span-12 {
        grid-column: span 12;
      } /* Linha cheia (100%) */
      .span-8 {
        grid-column: span 8;
      } /* 2/3 da linha */
      .span-6 {
        grid-column: span 6;
      } /* Meia linha (50%) */
      .span-4 {
        grid-column: span 4;
      } /* 1/3 da linha */

      footer {
        margin-top: 30px;
        text-align: center;
        font-size: 0.8rem;
        border-top: 1px solid #ccc;
        padding-top: 10px;
      }

      /* Estilos para Impressão e Geração de PDF */
      @media print {
        @page {
          margin: 0;
          size: A4 portrait;
        }
        body {
          background: none;
          padding: 0;
        }
        .hq-container {
          box-shadow: none;
          max-width: 100%;
          padding: 10mm;
        }
        .btn-print {
          display: none;
        }
        /* Garante que o grid mantenha a estrutura na impressão */
        .pagina-hq {
          display: grid !important;
          break-inside: avoid;
        }
      }

      .btn-print {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 15px 30px;
        background: #e74c3c; /* Cor mais coerente com a paleta */
        color: white;
        border: 2px solid #000; /* Borda estilo HQ no botão */
        border-radius: 5px;
        cursor: pointer;
        font-family: "Bangers", cursive;
        font-size: 1.2rem;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 1);
        z-index: 100;
        transition:
          transform 0.1s,
          box-shadow 0.1s;
      }

      .btn-print:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 rgba(0, 0, 0, 1);
      }
    </style>
  </head>
  <body>
    <button class="btn-print" onclick="window.print()">
      IMPRIMIR HQ / SALVAR PDF
    </button>

    <main class="hq-container">
      <!-- CAPA -->
      <section class="capa-hq">
        <header class="capa-header">
          <p class="capa-subtítulo">Meningite e Vacinação</p>
          <h1 class="capa-titulo">O Inimigo Invisível</h1>
        </header>
        <img
          src="panel_images_3/capa.png"
          alt="Capa: O Inimigo Invisível"
          class="capa-arte"
        />
        <footer class="capa-rodape">Edição Especial Educativa</footer>
      </section>

      <!-- CABEÇALHO INTERNO -->
      <header>
        <p class="subtitle">Meningite e Vacinação</p>
        <h1>O Inimigo Invisível</h1>
      </header>

      <!-- PÁGINA 1 -->
      <section class="pagina-hq">
        <figure class="quadro span-12">
          <img
            src="panel_images_3/pagina 1 painel 1.png"
            alt="Página 1 Painel 1"
          />
        </figure>
        <figure class="quadro span-6">
          <img
            src="panel_images_3/pagina 1 painel 2.png"
            alt="Página 1 Painel 2"
          />
        </figure>
        <figure class="quadro span-6">
          <img
            src="panel_images_3/pagina 1 painel 3.png"
            alt="Página 1 Painel 3"
          />
        </figure>
      </section>

      <!-- PÁGINA 2 (Exemplo de layout com 3 quadros e peso diferente) -->
      <section class="pagina-hq">
        <figure class="quadro span-4">
          <img
            src="panel_images_3/pagina 2 painel 1.png"
            alt="Página 2 Painel 1"
          />
        </figure>
        <figure class="quadro span-8">
          <img
            src="panel_images_3/pagina 2 painel 2.png"
            alt="Página 2 Painel 2"
          />
        </figure>
        <figure class="quadro span-12">
          <img
            src="panel_images_3/pagina 2 painel 3.jpg"
            alt="Página 2 Painel 3"
          />
        </figure>
      </section>

      <!-- PÁGINA 3 -->
      <section class="pagina-hq">
        <figure class="quadro span-12">
          <img
            src="panel_images_3/pagina 3 painel 1.png"
            alt="Página 3 Painel 1"
          />
        </figure>
        <figure class="quadro span-4">
          <img
            src="panel_images_3/pagina 3 painel 2.png"
            alt="Página 3 Painel 2"
          />
        </figure>
        <figure class="quadro span-4">
          <img
            src="panel_images_3/pagina 3 painel 3.png"
            alt="Página 3 Painel 3"
          />
        </figure>
        <figure class="quadro span-4">
          <img
            src="panel_images_3/pagina 3 painel 4.png"
            alt="Página 3 Painel 4"
          />
        </figure>
      </section>

      <!-- PÁGINA 4 -->
      <section class="pagina-hq">
        <figure class="quadro span-12">
          <img
            src="panel_images_3/pagina 4 painel 1.png"
            alt="Página 4 Painel 1"
          />
        </figure>
        <figure class="quadro span-6">
          <img
            src="panel_images_3/pagina 4 painel 2.png"
            alt="Página 4 Painel 2"
          />
        </figure>
        <figure class="quadro span-6">
          <img
            src="panel_images_3/pagina 4 painel 3.png"
            alt="Página 4 Painel 3"
          />
        </figure>
      </section>

      <!-- PÁGINA 5 -->
      <section class="pagina-hq">
        <figure class="quadro span-12">
          <img
            src="panel_images_3/pagina 5 painel 1.png"
            alt="Página 5 Painel 1"
          />
        </figure>
        <figure class="quadro span-6">
          <img
            src="panel_images_3/pagina 5 painel 2.png"
            alt="Página 5 Painel 2"
          />
        </figure>
        <figure class="quadro span-6">
          <img
            src="panel_images_3/pagina 5 painel 3.png"
            alt="Página 5 Painel 3"
          />
        </figure>
      </section>

      <footer>
        <p>Material Educativo — Prevenção Salva Vidas</p>
      </footer>
    </main>
  </body>
</html>
